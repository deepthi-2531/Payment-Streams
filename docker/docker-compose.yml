services:
  # Canton sandbox participant node
  canton:
    build:
      context: ..
      dockerfile: docker/Dockerfile.canton
    # Bind published ports to loopback only. The Admin API (10011)
    # has NO authentication — party allocation, DAR upload, user management
    # are all open to anyone who can reach it. On shared Wi-Fi or a cloud
    # VM a 0.0.0.0 publish would hand full participant control to the
    # network. Override the host interface via DOCKER_BIND_HOST for a
    # deliberately-exposed deployment behind its own firewall.
    ports:
      - '${DOCKER_BIND_HOST:-127.0.0.1}:5001:6865' # Ledger API (gRPC)
      - '${DOCKER_BIND_HOST:-127.0.0.1}:5002:10011' # Admin API
    volumes:
      - canton-data:/canton/data
      - ../packages/daml:/daml-packages:ro
    environment:
      - CANTON_LOG_LEVEL=INFO
    healthcheck:
      test: ['CMD-SHELL', 'bash -lc "echo > /dev/tcp/127.0.0.1/6865"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Streams REST proxy
  proxy:
    build:
      context: ..
      dockerfile: docker/Dockerfile.proxy
    # Loopback-bind the proxy's published port too.
    ports:
      - '${DOCKER_BIND_HOST:-127.0.0.1}:4000:4000'
    depends_on:
      canton:
        condition: service_healthy
    environment:
      - PROXY_PORT=4000
      - CANTON_HOST=canton
      - CANTON_PORT=6865
      # Main package id from the Docker-built canton-streams DAR.
      # Required because Ledger API gRPC template identifiers use package hashes.
      - CANTON_STREAMS_PACKAGE_ID=e7761a44781d89616e98f3a521cf6bc3095b37bd5343b219dc9a996424f3319a
      # This is a LOCAL DEV compose. Dev auth is explicitly
      # acknowledged here; the proxy refuses to boot in dev mode without
      # this flag. NEVER set PROXY_ALLOW_DEV_AUTH in a real deployment —
      # use PROXY_AUTH_MODE=jwt with PROXY_OIDC_ISSUER instead.
      - PROXY_AUTH_MODE=dev
      - PROXY_ALLOW_DEV_AUTH=true
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/api/health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Dashboard web UI
  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
      args:
        VITE_WALLET_LAYER: ${VITE_WALLET_LAYER:-dapp-sdk}
        VITE_WALLET_GATEWAY_URL: ${VITE_WALLET_GATEWAY_URL:-http://localhost:3030/api/v0/dapp}
        VITE_SKIP_WALLET_PICKER: ${VITE_SKIP_WALLET_PICKER:-true}
        VITE_WALLET_NAME: ${VITE_WALLET_NAME:-Splice Amulet Wallet}
        VITE_PARTYLAYER_NETWORK: ${VITE_PARTYLAYER_NETWORK:-devnet}
        VITE_PARTYLAYER_APP_NAME: ${VITE_PARTYLAYER_APP_NAME:-Canton Payment Streams}
    ports:
      - '3000:80'
    depends_on:
      proxy:
        condition: service_healthy

volumes:
  canton-data:

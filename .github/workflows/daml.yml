name: Daml Build & Test

# Installs the pinned Daml SDK, fetches the CIP-56 V2 Token Standard DARs
# from canton-network/splice (source build), builds every Daml package, and
# runs the acceptance suite — the end-to-end proof for the Daml side.
#
# The fetch clones the upstream Splice repo and runs `daml build` across 6+
# source packages, so a fresh run takes several minutes. To keep that cost
# off unrelated commits, the automatic triggers are scoped to changes that
# actually affect the Daml build (sources, the fetch script, and the pin
# file); everything else never triggers it. It can still be run by hand.
#
# Inputs:
#   splice_ref — git ref in canton-network/splice to build V2 DARs from.
#                Defaults to the pinned commit baked into
#                scripts/fetch-v2-dars.mjs; the build verifies fetched DAR
#                hashes against scripts/v2-dar-pins.json either way.

on:
  push:
    branches: [main]
    paths:
      - 'packages/daml/**'
      - 'scripts/fetch-v2-dars.mjs'
      - 'scripts/v2-dar-pins.json'
      - 'scripts/test-all-daml.sh'
      - '.github/workflows/daml.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/daml/**'
      - 'scripts/fetch-v2-dars.mjs'
      - 'scripts/v2-dar-pins.json'
      - 'scripts/test-all-daml.sh'
      - '.github/workflows/daml.yml'
  workflow_dispatch:
    inputs:
      splice_ref:
        description: 'Splice git ref to build V2 DARs from (empty = pinned commit)'
        required: false
        default: ''

# Least-privilege default token scope.
permissions:
  contents: read

jobs:
  daml:
    name: Daml Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install Daml SDK
        # Pin the SDK version and the installer itself: fetch the script,
        # verify its sha256 against the expected digest, then run it with the
        # explicit version so it never resolves the moving "latest" channel.
        # Bump DAML_SDK_VERSION / DAML_INSTALLER_SHA256 together on upgrade.
        env:
          DAML_SDK_VERSION: '3.4.10'
          DAML_INSTALLER_SHA256: d3d5527e3d535df2c723d8d2b68d72d224b9e0c74554e38192e1435df5c5b92c
        run: |
          curl -sSL https://get.daml.com/ -o /tmp/daml-install.sh
          echo "${DAML_INSTALLER_SHA256}  /tmp/daml-install.sh" | sha256sum -c -
          sh /tmp/daml-install.sh "$DAML_SDK_VERSION"
          rm -f /tmp/daml-install.sh
          echo "$HOME/.daml/bin" >> "$GITHUB_PATH"

      - name: Verify Daml SDK install
        run: |
          daml version
          ls -la "$HOME/.daml/bin"

      - name: Fetch Splice V2 DARs (source build)
        # Pass the user-controlled input via the environment, not by
        # interpolating `${{ inputs.* }}` directly into the run block (which
        # would let a crafted ref inject shell). `$SPLICE_REF` is quoted.
        env:
          SPLICE_REF: ${{ inputs.splice_ref }}
        run: |
          if [ -n "$SPLICE_REF" ]; then
            node scripts/fetch-v2-dars.mjs --mode source-build --splice-ref "$SPLICE_REF"
          else
            node scripts/fetch-v2-dars.mjs --mode source-build
          fi

      - name: Verify V2 DARs are in place
        run: |
          ls -la packages/daml/main/.lib/ | head -20
          test -f packages/daml/main/.lib/splice-api-token-allocation-v2-1.0.0.dar

      - name: Build Daml packages
        run: |
          set -e
          for pkg in interfaces main test scripts; do
            if [ -f "packages/daml/$pkg/daml.yaml" ]; then
              echo "=== Building packages/daml/$pkg ==="
              (cd "packages/daml/$pkg" && daml build)
            fi
          done

      - name: Run Daml tests
        run: bash scripts/test-all-daml.sh

      - name: Upload built DARs as artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canton-streams-dars
          path: packages/daml/**/.daml/dist/*.dar
          if-no-files-found: warn
          retention-days: 14

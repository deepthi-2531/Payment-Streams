name: CI

# Least-privilege default GITHUB_TOKEN scope — CI only reads the repo.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── V2 Token Standard upstream conformance lint ───
  # Fails the build if any tracked file mentions a V2 token-standard
  # identifier that is not in the configured upstream reference.
  # Independent of the TypeScript build so a bad doc commit fails fast.
  v2_conformance:
    name: V2 Upstream Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Run V2 conformance lint
        run: bash scripts/check-v2-conformance.sh

  # ─── TypeScript lint, build, test ───
  typescript:
    name: TypeScript Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Don't pin a `version:` here — package.json carries `packageManager`
      # which the action honors. Passing both causes a hard error.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint via direct pnpm workspace recursion to avoid turbo's
      # package-manager-binary detection issue with corepack.
      - name: Lint
        run: pnpm -r --workspace-concurrency=1 run lint

      - name: Build SDK
        run: pnpm --filter @canton-streams/sdk build

      - name: Build CLI
        run: pnpm --filter @canton-streams/cli build

      - name: Build Dashboard
        run: pnpm --filter @canton-streams/dashboard build

      - name: Test SDK
        run: pnpm --filter @canton-streams/sdk test

      - name: Test Dashboard
        run: pnpm --filter @canton-streams/dashboard test

  # ─── Docker build (push to main only) ───
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [typescript]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build dashboard image
        run: |
          docker build -f docker/Dockerfile.dashboard -t canton-streams-dashboard:latest .

# ──────────────────────────────────────────────────────────────────────────
# Daml build & test lives in its own workflow, not this fast push pipeline.
#
# The canton-streams DAR depends on CIP-56 V2 Token Standard packages from
# canton-network/splice. When pre-built DARs are not available, building
# them requires cloning the upstream Splice repo and running `daml build`
# against 6+ source packages — a 10-30 minute operation per fresh CI runner.
#
# So the Daml build & test runs in `.github/workflows/daml.yml`, which
# triggers on changes under packages/daml/** (plus the fetch script and pin
# file) and on demand — giving a green check when the Daml side changes
# without repeating the heavy build on unrelated commits. Contributors run
# `pnpm daml:deps && pnpm daml:build` locally; see CONTRIBUTING.md.
# ──────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── TypeScript lint, build, test ───
  typescript:
    name: TypeScript Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Don't pin a `version:` here — package.json carries `packageManager`
      # which the action honors. Passing both causes a hard error.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint via direct pnpm workspace recursion to avoid turbo's
      # package-manager-binary detection issue with corepack.
      - name: Lint
        run: pnpm -r --workspace-concurrency=1 run lint

      - name: Build SDK
        run: pnpm --filter @canton-streams/sdk build

      - name: Build CLI
        run: pnpm --filter @canton-streams/cli build

      - name: Build Dashboard
        run: pnpm --filter @canton-streams/dashboard build

      - name: Test SDK
        run: pnpm --filter @canton-streams/sdk test

      - name: Test Dashboard
        run: pnpm --filter @canton-streams/dashboard test

  # ─── Daml build & test ───
  daml:
    name: Daml Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Daml SDK 3.4.10
        run: |
          curl -sSL https://get.daml.com/ | sh -s -- 3.4.10
          echo "$HOME/.daml/bin" >> $GITHUB_PATH

      - name: Verify Daml SDK install
        run: |
          daml version || echo "daml CLI not on PATH"
          ls -la "$HOME/.daml/bin" || true

      - name: Download Daml Finance + Splice V2 dependencies
        run: bash packages/daml/get-dependencies.sh

      - name: Build Daml packages
        run: |
          set -e
          for pkg in interfaces main test scripts; do
            if [ -f "packages/daml/$pkg/daml.yaml" ]; then
              echo "=== Building packages/daml/$pkg ==="
              (cd "packages/daml/$pkg" && daml build)
            fi
          done

      - name: Run Daml tests
        run: bash scripts/test-all-daml.sh
        continue-on-error: true

  # ─── Docker build (push to main only) ───
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [typescript]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build dashboard image
        run: |
          docker build -f docker/Dockerfile.dashboard -t canton-streams-dashboard:latest .

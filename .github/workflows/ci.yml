name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── V2 Token Standard upstream conformance lint ───
  # Fails the build if any tracked file mentions an identifier that
  # does not exist in canton-network/splice@token-standard-v2-upcoming.
  # Independent of the TypeScript build so a bad doc commit fails fast.
  v2_conformance:
    name: V2 Upstream Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run V2 conformance lint
        run: bash scripts/check-v2-conformance.sh

  # ─── TypeScript lint, build, test ───
  typescript:
    name: TypeScript Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Don't pin a `version:` here — package.json carries `packageManager`
      # which the action honors. Passing both causes a hard error.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint via direct pnpm workspace recursion to avoid turbo's
      # package-manager-binary detection issue with corepack.
      - name: Lint
        run: pnpm -r --workspace-concurrency=1 run lint

      - name: Build SDK
        run: pnpm --filter @canton-streams/sdk build

      - name: Build CLI
        run: pnpm --filter @canton-streams/cli build

      - name: Build Dashboard
        run: pnpm --filter @canton-streams/dashboard build

      - name: Test SDK
        run: pnpm --filter @canton-streams/sdk test

      - name: Test Dashboard
        run: pnpm --filter @canton-streams/dashboard test

  # ─── Docker build (push to main only) ───
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [typescript]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build dashboard image
        run: |
          docker build -f docker/Dockerfile.dashboard -t canton-streams-dashboard:latest .

# ──────────────────────────────────────────────────────────────────────────
# Daml build & test is intentionally NOT in the push-triggered pipeline.
#
# The canton-streams DAR depends on CIP-56 V2 Token Standard packages from
# `canton-network/splice@token-standard-v2-upcoming`. Until Splice publishes
# pre-built V2 DARs as release artifacts, building them requires cloning
# the upstream Splice repo and running `daml build` against 6+ source
# packages — a 10-30 minute operation per fresh CI runner.
#
# We run the Daml build manually via `.github/workflows/daml.yml`
# (workflow_dispatch). Contributors run `pnpm daml:deps && pnpm daml:build`
# locally; see CONTRIBUTING.md for the developer-side flow.
# ──────────────────────────────────────────────────────────────────────────

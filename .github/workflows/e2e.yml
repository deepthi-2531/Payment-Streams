name: E2E — Wallet-backed V2 (manual)

# Runs the live Splice LocalNet Amulet wallet flow against the Streams
# docker stack and exercises the V2 allocation choices end-to-end.
#
# This job is intentionally NOT triggered on push. The Splice LocalNet
# stack takes 10-30 minutes to build on a cold cache and needs sbt +
# Postgres + Daml SDK at runtime. Run it on demand when validating the
# pinned upstream commit or a wallet-flow change.
#
# Trigger: GitHub Actions → "E2E — Wallet-backed V2 (manual)" → Run
# workflow. The dry-run mode is the default so a misclick does not
# accidentally start a 30-minute build.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print plan only — do not clone/build/start anything'
        type: boolean
        default: true
      splice_pinned_commit:
        description: 'Override SPLICE_PINNED_COMMIT (leave empty to use scripts/fetch-v2-dars.mjs)'
        type: string
        default: ''
      wallet_gateway_url:
        description: 'Override the Amulet wallet gateway URL (default http://localhost:3030/api/v0/dapp)'
        type: string
        default: ''
      skip_localnet_build:
        description: 'Skip cloning + building Splice LocalNet (only useful when re-running just the Streams stack)'
        type: boolean
        default: false

# [L-16] Least-privilege default token scope.
permissions:
  contents: read

jobs:
  e2e:
    name: Wallet-backed V2 E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve effective Splice pinned commit
        id: splicepin
        # [L-17] User-controlled input via env, never interpolated into the
        # script body. Also validate it's a hex git sha before use.
        env:
          INPUT_PINNED_COMMIT: ${{ inputs.splice_pinned_commit }}
        run: |
          if [ -n "$INPUT_PINNED_COMMIT" ]; then
            if ! printf '%s' "$INPUT_PINNED_COMMIT" | grep -Eq '^[0-9a-f]{7,40}$'; then
              echo "splice_pinned_commit must be a hex git sha" >&2
              exit 1
            fi
            echo "commit=$INPUT_PINNED_COMMIT" >> "$GITHUB_OUTPUT"
          else
            commit="$(grep -m1 SPLICE_PINNED_COMMIT scripts/fetch-v2-dars.mjs | sed -E "s/.*'([0-9a-f]+)'.*/\1/")"
            echo "commit=$commit" >> "$GITHUB_OUTPUT"
          fi

      - name: Print resolved configuration
        # [L-17] Inputs via env, not interpolated into the echo (a crafted
        # wallet_gateway_url with backticks/$() would otherwise run in shell).
        env:
          RESOLVED_COMMIT: ${{ steps.splicepin.outputs.commit }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_SKIP_BUILD: ${{ inputs.skip_localnet_build }}
          INPUT_GATEWAY: ${{ inputs.wallet_gateway_url }}
        run: |
          echo "Resolved SPLICE_PINNED_COMMIT: $RESOLVED_COMMIT"
          echo "Dry run: $INPUT_DRY_RUN"
          echo "Skip LocalNet build: $INPUT_SKIP_BUILD"
          echo "Wallet gateway override: $INPUT_GATEWAY"

      # Drives scripts/start-localnet-e2e.sh with the operator-provided
      # overrides. SPLICE_PINNED_COMMIT, LOCALNET_DRY_RUN, and
      # SKIP_LOCALNET_BUILD steer the Splice clone/build path; the new
      # wallet_gateway_url input is forwarded as both WALLET_GATEWAY_URL
      # (consumed by start-localnet-e2e.sh's CIP-103 probe) and
      # VITE_WALLET_GATEWAY_URL (consumed by docker/docker-compose.yml's
      # dashboard build arg). When the input is left empty, both env vars
      # are empty strings and the `:-` defaults in the shell script and
      # docker-compose substitution preserve the documented LocalNet
      # default (http://localhost:3030/api/v0/dapp).
      - name: Run orchestration script
        env:
          SPLICE_PINNED_COMMIT: ${{ steps.splicepin.outputs.commit }}
          LOCALNET_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          SKIP_LOCALNET_BUILD: ${{ inputs.skip_localnet_build && '1' || '0' }}
          WALLET_GATEWAY_URL: ${{ inputs.wallet_gateway_url }}
          VITE_WALLET_GATEWAY_URL: ${{ inputs.wallet_gateway_url }}
        run: bash scripts/start-localnet-e2e.sh

      - name: Run V2 conformance lint (defense in depth)
        if: always()
        run: bash scripts/check-v2-conformance.sh

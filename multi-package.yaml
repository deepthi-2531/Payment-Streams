# The core workspace: the shipped interfaces + main DAR and the acceptance
# test suite. These build reproducibly green from a clean clone.
#
# `packages/daml/scripts` contains local MintV2 / V2-lifecycle helpers and is
# deliberately NOT part of the default RC build. It depends on `splice-test-token-v2`,
# whose package ids can conflict with the main pinned V2 DARs. Treat it as source
# reference until the helper DAR dependencies are refreshed as a separate task.
packages:
  - packages/daml/interfaces
  - packages/daml/main
  - packages/daml/test

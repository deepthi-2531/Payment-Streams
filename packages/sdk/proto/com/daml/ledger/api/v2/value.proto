// Canton Ledger API v2 — Value message definitions.
// Field numbers match Canton 3.4.11+ server reflection.

syntax = "proto3";

package com.daml.ledger.api.v2;

option java_outer_classname = "ValueOuterClass";
option java_package = "com.daml.ledger.api.v2";

import "google/protobuf/empty.proto";

// Encodes values that the ledger accepts as command arguments and emits as
// contract arguments / choice results.
// Field numbers from Canton 3.4.11+ server reflection.
message Value {
  oneof sum {
    google.protobuf.Empty unit = 1;
    bool bool = 2;
    sint64 int64 = 3;
    int32 date = 4;
    sfixed64 timestamp = 5;
    string numeric = 6;
    string party = 7;
    string text = 8;
    string contract_id = 9;
    Optional optional = 10;
    List list = 11;
    TextMap text_map = 12;
    GenMap gen_map = 13;
    Record record = 14;
    Variant variant = 15;
    Enum enum = 16;
  }
}

message Record {
  Identifier record_id = 1;
  repeated RecordField fields = 2;
}

message RecordField {
  string label = 1;
  Value value = 2;
}

message Identifier {
  string package_id = 1;
  string module_name = 2;
  string entity_name = 3;
}

message Variant {
  Identifier variant_id = 1;
  // Server field name is "constructor" but protobufjs conflicts with JS
  // Object.prototype.constructor. Renamed; field number 2 is wire-compatible.
  string variant_constructor = 2 [json_name = "constructor"];
  Value value = 3;
}

message Enum {
  Identifier enum_id = 1;
  // Same renaming as Variant.constructor above.
  string enum_constructor = 2 [json_name = "constructor"];
}

message List {
  repeated Value elements = 1;
}

message Optional {
  Value value = 1; // absent → None
}

message TextMap {
  message Entry {
    string key = 1;
    Value value = 2;
  }
  repeated Entry entries = 1;
}

message GenMap {
  message Entry {
    Value key = 1;
    Value value = 2;
  }
  repeated Entry entries = 1;
}

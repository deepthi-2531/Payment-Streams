sdk-version: 3.4.10
name: canton-streams
source: daml
# Bumped 1.2.0 -> 1.3.0: adds `OperatorEscrow` — the operator-custodied
# streaming escrow (operator is sole signatory and holds the deposited funds;
# payer/payee are fields, not stakeholders) for wallets that cannot vet this
# DAR. Existing templates are unchanged, so this is a smart-contract-upgrade-
# compatible successor of 1.2.0 (additive vetting, no unvet).
#
# 1.2.0 added `StreamRecord` (operator-signed direct-transfer index) and
# `StreamMandate` (the payer's rate-limited, revocable pull authorization).
version: 1.3.0
dependencies:
  - daml-prim
  - daml-stdlib
data-dependencies:
  - ../interfaces/.daml/dist/canton-streams-interfaces-1.0.0.dar
  # ---------------------------------------------------------------------
  # CIP-56 Token Standard V2. Fetched via `node scripts/fetch-v2-dars.mjs`.
  #
  # V1 interfaces are NOT bound here. Per CIP-0112 §5, V1 assets are
  # expected to publish V2 alongside V1; once an asset advertises V2 in
  # `supportedApis`, our library integrates with it.
  - .lib/splice-api-token-metadata-v1-1.0.0.dar
  - .lib/splice-api-token-holding-v2-1.0.0.dar
  - .lib/splice-api-token-allocation-v2-1.0.0.dar
  - .lib/splice-api-token-allocation-request-v2-1.0.0.dar
start-navigator: no

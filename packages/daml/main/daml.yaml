sdk-version: 3.4.10
name: canton-streams
source: daml
# Bumped 1.0.0 -> 1.1.0: this release changes lifecycle choice bodies
# (cancellation priced at ledger time; mandatory schedule cap on the V2
# operator settlement path). Template signatures/payloads are unchanged, so
# this is a smart-contract-upgrade-compatible successor of 1.0.0.
version: 1.1.0
dependencies:
  - daml-prim
  - daml-stdlib
data-dependencies:
  - ../interfaces/.daml/dist/canton-streams-interfaces-1.0.0.dar
  # ---------------------------------------------------------------------
  # CIP-56 Token Standard V2. Fetched via `node scripts/fetch-v2-dars.mjs`.
  #
  # V1 interfaces are NOT bound here. Per CIP-0112 §5, V1 assets are
  # expected to publish V2 alongside V1; once an asset advertises V2 in
  # `supportedApis`, our library integrates with it.
  - .lib/splice-api-token-metadata-v1-1.0.0.dar
  - .lib/splice-api-token-holding-v2-1.0.0.dar
  - .lib/splice-api-token-allocation-v2-1.0.0.dar
  - .lib/splice-api-token-allocation-request-v2-1.0.0.dar
start-navigator: no

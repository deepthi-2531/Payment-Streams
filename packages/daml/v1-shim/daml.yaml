sdk-version: 3.4.10
name: canton-streams-v1-shim
source: daml
version: 1.0.0
dependencies:
  - daml-prim
  - daml-stdlib
data-dependencies:
  # -------------------------------------------------------------------
  # Transitional CIP-56 V1 lane (splice-api-token-allocation-v1).
  #
  # This package is deliberately SEPARATE from `canton-streams` (main):
  #   - the main package hash stays stable (the Milestone-1 template
  #     manifest pins it), and
  #   - retiring the V1 lane = stop deploying this one DAR.
  #
  # IMPORTANT: these MUST be the OFFICIAL Splice release DARs — the same
  # package ids that are vetted on the target network. Source-built DARs
  # hash differently and the participant rejects vetting a second
  # package with the same name+version (verified on TestNet: official
  # splice-api-token-metadata-v1 is 25952a7c…, a source-build is not).
  #
  # Populate `.lib/` from the Splice release that the target validator
  # runs, e.g. from the validator-app image:
  #
  #   IMAGE=ghcr.io/digital-asset/decentralized-canton-sync/docker/validator-app:<version>
  #   CONTAINER_ID=<container created from IMAGE>
  #   docker cp <container-id>:/app/splice-node/dars/splice-api-token-metadata-v1-1.0.0.dar .lib/
  #   …(holding-v1, allocation-v1, allocation-request-v1)…
  #   docker rm <container-id>
  # -------------------------------------------------------------------
  - .lib/splice-api-token-metadata-v1-1.0.0.dar
  - .lib/splice-api-token-holding-v1-1.0.0.dar
  - .lib/splice-api-token-allocation-v1-1.0.0.dar
  - .lib/splice-api-token-allocation-request-v1-1.0.0.dar
build-options:
  - --target=2.1
start-navigator: no
